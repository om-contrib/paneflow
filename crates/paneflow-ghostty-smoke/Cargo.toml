[package]
name = "paneflow-ghostty-smoke"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
native = [
    "dep:paneflow-terminal-ghostty",
    "dep:portable-pty",
    "paneflow-terminal-ghostty/native",
]

[[bin]]
name = "paneflow-ghostty-smoke"
path = "src/main.rs"
required-features = ["native"]

[dependencies]
anyhow.workspace = true

# The POSIX smoke drives a real PTY through portable-pty and /bin/sh, which
# behaves the same on Darwin as on Linux.
[target.'cfg(any(target_os = "linux", all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
libc.workspace = true
portable-pty = { version = "0.9.0", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "windows", all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
paneflow-terminal-ghostty = { path = "../paneflow-terminal-ghostty", optional = true }

[lints]
workspace = true
